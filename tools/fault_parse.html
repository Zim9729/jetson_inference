<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>缺陷压缩包分类工具</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","Segoe UI",sans-serif;background:#f0f2f5;color:#333;padding:20px;min-height:100vh}
.container{max-width:860px;margin:0 auto}
h1{text-align:center;margin-bottom:8px;color:#1a1a1a;font-size:24px}
.subtitle{text-align:center;color:#888;font-size:13px;margin-bottom:24px}

/* 模式提示 */
.mode-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;margin-left:8px}
.mode-full{background:#f6ffed;color:#52c41a;border:1px solid #b7eb8f}
.mode-lite{background:#fff7e6;color:#fa8c16;border:1px solid #ffd591}

/* 面板 */
.panel{background:#fff;border-radius:8px;padding:24px;box-shadow:0 1px 3px rgba(0,0,0,.1);margin-bottom:20px}
.panel h3{margin-bottom:16px;font-size:16px;color:#333}

/* 表单 */
.form-group{margin-bottom:16px}
label{display:block;font-weight:600;margin-bottom:6px;color:#555;font-size:14px}
.dir-display{padding:10px 12px;background:#fafafa;border:1px solid #d9d9d9;border-radius:4px;font-size:13px;color:#666;word-break:break-all;min-height:38px;display:flex;align-items:center}
.dir-display.empty{color:#bbb;font-style:italic}

/* 按钮 */
.btn{padding:8px 20px;border:none;border-radius:4px;cursor:pointer;font-size:14px;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:#1677ff;color:#fff}
.btn-primary:hover{background:#4096ff}
.btn-primary:disabled{background:#d9d9d9;cursor:not-allowed}
.btn-secondary{background:#f0f0f0;color:#333}
.btn-secondary:hover{background:#e0e0e0}
.btn-danger{background:#ff4d4f;color:#fff}
.btn-danger:hover{background:#ff7875}
.btn-large{padding:12px 40px;font-size:16px}
.btn-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* 拖拽区 */
.drop-zone{border:2px dashed #d9d9d9;border-radius:8px;padding:32px;text-align:center;color:#999;font-size:14px;transition:all .2s;cursor:pointer}
.drop-zone:hover{border-color:#4096ff;color:#4096ff}
.drop-zone.dragover{border-color:#1677ff;background:#f0f7ff;color:#1677ff}

/* 进度 */
.progress-section{display:none}
.progress-section.active{display:block}
.progress-bar-wrap{background:#f0f0f0;border-radius:4px;height:24px;overflow:hidden;margin-bottom:8px}
.progress-bar{height:100%;background:linear-gradient(90deg,#1677ff,#4096ff);transition:width .3s;width:0%}
.progress-text{text-align:center;font-size:13px;color:#666}
.current-file{margin-top:8px;font-size:12px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.log-area{margin-top:12px;max-height:150px;overflow-y:auto;background:#fafafa;border-radius:4px;padding:8px 12px;font-size:12px;font-family:Consolas,monospace;color:#666}
.log-line{padding:2px 0}
.log-ok{color:#52c41a}
.log-fail{color:#ff4d4f}
.log-skip{color:#faad14}

/* 结果 */
.result-section{display:none}
.result-section.active{display:block}
.result-table{width:100%;border-collapse:collapse}
.result-table th,.result-table td{padding:10px 12px;text-align:left;border-bottom:1px solid #f0f0f0}
.result-table th{background:#fafafa;font-weight:600;color:#555;font-size:13px}
.result-table tr:hover{background:#fafafa}
.folder-link{color:#1677ff;cursor:pointer;text-decoration:underline}
.summary-row{font-weight:600;background:#fafafa}
.download-btn{color:#1677ff;cursor:pointer;text-decoration:underline;font-size:13px}

/* 预览 */
.preview-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:2000;align-items:center;justify-content:center}
.preview-overlay.active{display:flex}
.preview-content{max-width:90%;max-height:90%;text-align:center;position:relative}
.preview-content img{max-width:100%;max-height:80vh;border-radius:4px}
.preview-nav{margin-top:12px;display:flex;gap:12px;justify-content:center;align-items:center}
.preview-counter{color:#fff;font-size:14px}
.preview-close{position:absolute;top:-40px;right:0;color:#fff;font-size:28px;cursor:pointer}

/* 警告 */
.alert{padding:12px 16px;border-radius:4px;margin-bottom:16px;font-size:13px}
.alert-warning{background:#fffbe6;border:1px solid #ffe58f;color:#ad6800}
.alert-error{background:#fff2f0;border:1px solid #ffccc7;color:#ff4d4f}
.alert-info{background:#e6f4ff;border:1px solid #91caff;color:#0958d9}

/* 文件输入（隐藏） */
#fileInput{display:none}

/* 处理中状态: 禁用输入区所有交互 */
.panel.processing{pointer-events:none;opacity:.6}
.panel.processing .btn-secondary{cursor:not-allowed}

/* 结果区 Tab */
.result-tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:2px solid #f0f0f0}
.tab-btn{padding:8px 16px;border:none;background:transparent;cursor:pointer;font-size:14px;color:#666;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
.tab-btn:hover{color:#1677ff}
.tab-btn.active{color:#1677ff;border-bottom-color:#1677ff;font-weight:600}
.tab-count{display:inline-block;background:#f0f0f0;color:#666;border-radius:10px;padding:0 6px;font-size:12px;margin-left:4px;min-width:18px;text-align:center}
.tab-btn.active .tab-count{background:#e6f4ff;color:#1677ff}

/* 失败表格 */
#failedTable .fail-reason{color:#ff4d4f;font-size:12px;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#failedTable .fail-status-skip{color:#faad14}
#failedTable .fail-status-fail{color:#ff4d4f}

/* 预览缩放 */
.preview-img-wrap{overflow:auto;max-width:100%;max-height:80vh;cursor:grab;border-radius:4px;background:#1a1a1a;display:flex;align-items:center;justify-content:center;min-height:300px}
.preview-img-wrap.dragging{cursor:grabbing}
.preview-img-wrap img{display:block;flex-shrink:0;max-width:none;max-height:none;border-radius:4px}
.preview-zoom-info{color:#fff;font-size:13px;min-width:50px;text-align:center}

/* 模式选择器 */
.mode-selector{display:flex;gap:0;margin-bottom:20px;border-radius:8px;overflow:hidden;border:1px solid #d9d9d9}
.mode-btn{flex:1;padding:14px 20px;border:none;background:#fff;cursor:pointer;font-size:15px;color:#666;transition:all .2s;border-bottom:3px solid transparent}
.mode-btn:hover{background:#f5f5f5}
.mode-btn.active{color:#1677ff;border-bottom-color:#1677ff;font-weight:600;background:#f0f7ff}
</style>
</head>
<body>
<div class="container">
  <h1>缺陷压缩包分类工具 <span id="modeBadge" class="mode-badge"></span></h1>
  <p class="subtitle">解析 zip 压缩包中的 CSV 元数据，按缺陷类型分类图片</p>

  <div id="browserWarning" style="display:none">
    <div class="alert alert-warning">
      ⚠ 当前浏览器不支持 File System Access API，已切换为降级模式：<br>
      选择或拖入多个 .zip 文件 → 自动分类 → 下载分类结果压缩包。<br>
      推荐 <a href="https://www.google.com/chrome/" target="_blank">Chrome 103+</a> 或 <a href="https://www.microsoft.com/edge" target="_blank">Edge 103+</a> 以获得完整体验。
    </div>
  </div>

  <!-- 模式选择器 -->
  <div class="mode-selector">
    <button class="mode-btn active" id="modeSortBtn" onclick="switchAppMode('sort')">开始解析</button>
    <button class="mode-btn" id="modeViewBtn" onclick="switchAppMode('view')">查看已分类</button>
  </div>

  <!-- 输入区 - 分类模式 -->
  <div class="panel" id="inputPanel">
    <div id="errorAlert" class="alert alert-error" style="display:none"></div>

    <div class="form-group" id="dirInputGroup">
      <label>输入目录（包含 .zip 压缩包）</label>
      <div class="btn-row">
        <div class="dir-display empty" id="srcDirDisplay" style="flex:1">未选择</div>
        <button class="btn btn-secondary" onclick="selectInputDir()">选择目录</button>
      </div>
    </div>

    <div class="form-group" id="fileInputGroup" style="display:none">
      <label>选择 .zip 文件（可多选或拖入）</label>
      <div class="drop-zone" id="dropZone">
        点击此处选择文件，或将 .zip 文件拖到此处
      </div>
      <input type="file" id="fileInput" multiple accept=".zip">
      <div id="fileListDisplay" class="dir-display empty" style="margin-top:8px">未选择</div>
    </div>

    <div class="form-group" id="outDirGroup">
      <label>输出目录（分类结果存放位置）</label>
      <div class="btn-row">
        <div class="dir-display empty" id="outDirDisplay" style="flex:1">未选择（将在输入目录下自动创建 _sorted）</div>
        <button class="btn btn-secondary" onclick="selectOutputDir()">选择目录</button>
      </div>
    </div>

    <div style="text-align:center;margin-top:20px;display:flex;gap:12px;justify-content:center">
      <button class="btn btn-primary btn-large" id="startBtn" onclick="startSort()" disabled>开始解析</button>
      <button class="btn btn-danger btn-large" id="cancelBtn" onclick="cancelSort()" style="display:none">取消</button>
    </div>
  </div>

  <!-- 输入区 - 查看模式 -->
  <div class="panel" id="viewPanel" style="display:none">
    <div id="viewErrorAlert" class="alert alert-error" style="display:none"></div>
    <div class="form-group">
      <label>选择已分类的结果目录（如 _sorted 文件夹）</label>
      <div class="btn-row">
        <div class="dir-display empty" id="viewDirDisplay" style="flex:1">未选择</div>
        <button class="btn btn-secondary" onclick="selectViewDir()">选择目录</button>
      </div>
    </div>
    <div id="viewLoading" style="display:none;text-align:center;padding:20px;color:#999">正在读取分类结果...</div>
  </div>

  <!-- 进度区 -->
  <div class="panel progress-section" id="progressSection">
    <h3>处理进度</h3>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
    <div class="progress-text" id="progressText">准备中...</div>
    <div class="current-file" id="currentFile"></div>
    <div class="log-area" id="logArea"></div>
  </div>

  <!-- 结果区 -->
  <div class="panel result-section" id="resultSection">
    <h3>分类结果 <span id="downloadHint" style="font-size:13px;font-weight:normal;color:#999"></span></h3>
    <div class="result-tabs">
      <button class="tab-btn active" id="tabParsed" onclick="switchResultTab('parsed')">已解析 <span class="tab-count" id="parsedCount">0</span></button>
      <button class="tab-btn" id="tabFailed" onclick="switchResultTab('failed')">未解析 <span class="tab-count" id="failedCount">0</span></button>
    </div>
    <div id="parsedTab">
      <table class="result-table" id="resultTable">
        <thead><tr><th>缺陷类型</th><th>图片数量</th><th>操作</th></tr></thead>
        <tbody id="resultBody"></tbody>
      </table>
    </div>
    <div id="failedTab" style="display:none">
      <table class="result-table" id="failedTable">
        <thead><tr><th>文件名</th><th>状态</th><th>原因</th></tr></thead>
        <tbody id="failedBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- 图片预览 -->
<div class="preview-overlay" id="previewOverlay">
  <div class="preview-content">
    <span class="preview-close" onclick="closePreview()">&times;</span>
    <div class="preview-img-wrap" id="previewImgWrap">
      <img id="previewImg" src="">
    </div>
    <div class="preview-nav">
      <button class="btn btn-secondary" onclick="prevImage()">&larr; 上一个</button>
      <span class="preview-counter" id="previewCounter"></span>
      <button class="btn btn-secondary" onclick="nextImage()">下一个 &rarr;</button>
      <span class="preview-zoom-info" id="zoomInfo">100%</span>
      <button class="btn btn-secondary" onclick="zoomReset()">重置</button>
      <button class="btn btn-secondary" onclick="zoomFit()">适合窗口</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// 缺陷类型映射表 (与 sort_fault_zips.py 中的 DEFECT_CLASS_MAP 一致)
// 来源: config_code.xml
// ============================================================
const DEFECT_CLASS_MAP = {
  2:"钢轨表面擦伤",3:"钢轨剥离掉块",16:"弹条缺失",24:"弹条断裂",
  32:"弹条位移",48:"螺栓缺失",49:"螺栓松脱",50:"垫片位移",
  51:"翻浆冒泥",128:"轨枕裂开",192:"轨枕剥离掉块",
  1024:"道床裂开",1536:"道床异物",8192:"螺母缺失",
};

function classCodeToName(code){
  if(!code) return "未知_元数据缺失";
  const n=parseInt(code);
  if(isNaN(n)) return "未知_无代码";
  return DEFECT_CLASS_MAP[n]||("未知_"+n);
}

// ============================================================
// 模式检测
// ============================================================
const supportsFsAccess = typeof window.showDirectoryPicker==='function';
const supportsDeflateRaw = typeof DecompressionStream!=='undefined' && (()=>{try{new DecompressionStream('deflate-raw');return true}catch{return false}})();
const FULL_MODE = supportsFsAccess && supportsDeflateRaw;

// 全局状态
let inputDirHandle=null, outputDirHandle=null;
let selectedFiles=[];
let classifiedBlobs={}; // 降级模式: { folderName: [{name, data}] }
let previewImages=[], previewIndex=0;
let currentPreviewUrl=null;  // Bug2: 跟踪当前 ObjectURL 以便释放
let previewSeq=0;            // BugB: 序列号, 防快速翻页竞态
let cancelled=false;         // UX11: 取消标志
let failedFiles=[];          // 未解析文件列表 [{name, status, reason}]
let zoomLevel=1;             // 预览缩放级别
let isDragging=false;        // 预览拖拽中
let dragStartX=0, dragStartY=0, dragScrollX=0, dragScrollY=0;
let appMode='sort';          // 'sort' 或 'view'
let viewDirHandle=null;      // 查看模式选的目录
let viewOutputDirHandle=null;// 查看模式专用, 不污染分类模式的 outputDirHandle

// ============================================================
// 初始化 UI
// ============================================================
(function initUI(){
  const badge=document.getElementById('modeBadge');
  if(FULL_MODE){
    badge.className='mode-badge mode-full';
    badge.textContent='完整模式';
  }else{
    badge.className='mode-badge mode-lite';
    badge.textContent='降级模式';
    document.getElementById('browserWarning').style.display='block';
    document.getElementById('dirInputGroup').style.display='none';
    document.getElementById('outDirGroup').style.display='none';
    document.getElementById('fileInputGroup').style.display='block';
    setupDropZone();
  }
})();

// ============================================================
// 模式切换
// ============================================================
function switchAppMode(mode){
  appMode=mode;
  document.getElementById('modeSortBtn').classList.toggle('active',mode==='sort');
  document.getElementById('modeViewBtn').classList.toggle('active',mode==='view');
  document.getElementById('inputPanel').style.display=mode==='sort'?'block':'none';
  document.getElementById('viewPanel').style.display=mode==='view'?'block':'none';
  // Bug3fix: 切换模式时重置 cancelled 状态, 避免残留影响 showResults
  cancelled=false;
  if(mode==='sort'){
    document.getElementById('resultSection').classList.remove('active');
    document.getElementById('progressSection').classList.remove('active');
  }else{
    document.getElementById('resultSection').classList.remove('active');
    // Bug2fix: 不再清空 outputDirHandle, 避免切回分类模式丢失已选输出目录
  }
}

// ============================================================
// 查看已分类模式
// ============================================================
async function selectViewDir(){
  if(!FULL_MODE){
    showViewError('查看已分类功能需要 Chrome/Edge 103+ 浏览器支持');
    return;
  }
  try{
    viewDirHandle=await window.showDirectoryPicker({mode:'read'});
    document.getElementById('viewDirDisplay').classList.remove('empty');
    document.getElementById('viewDirDisplay').textContent=viewDirHandle.name;
    document.getElementById('viewLoading').style.display='block';
    hideViewError();
    await loadSortedResults(viewDirHandle);
    document.getElementById('viewLoading').style.display='none';
  }catch(e){
    document.getElementById('viewLoading').style.display='none';
    if(e.name!=='AbortError'){
      showViewError('读取目录失败: '+(e.message||e.name));
    }
  }
}

function showViewError(msg){
  const el=document.getElementById('viewErrorAlert');
  el.textContent='❌ '+msg;
  el.style.display='block';
}
function hideViewError(){
  document.getElementById('viewErrorAlert').style.display='none';
}

async function loadSortedResults(dirHandle){
  // Bug1fix: 用独立的 viewOutputDirHandle, 不污染分类模式的 outputDirHandle
  viewOutputDirHandle=dirHandle;
  let manifest=null;
  try{
    const fh=await dirHandle.getFileHandle('_manifest.json');
    const file=await fh.getFile();
    const text=await file.text();
    manifest=JSON.parse(text);
  }catch{/* 无清单 */}

  if(manifest){
    failedFiles=manifest.failedFiles||[];
    const stats={};
    if(manifest.categories){
      for(const[folder,count]of Object.entries(manifest.categories)){
        stats[folder]=count;
      }
    }
    showResults(stats,manifest.succeeded||0,manifest.failed||0,manifest.totalFiles||0,false);
    return;
  }

  // 无清单, 扫描目录
  const stats={};
  let succeeded=0;
  for await(const[name,handle] of dirHandle.entries()){
    if(handle.kind==='directory'){
      let count=0;
      for await(const[fname,fhandle] of handle.entries()){
        if(fhandle.kind==='file'&&fname.toLowerCase().endsWith('.jpg')) count++;
      }
      if(count>0){stats[name]=count;succeeded+=count}
    }
  }
  failedFiles=[];
  if(Object.keys(stats).length===0){
    showViewError('该目录下未找到分类图片文件夹');
    return;
  }
  showResults(stats,succeeded,0,succeeded,false);
}

async function saveManifest(dirHandle,stats,succeeded,failed,total,failedList,sourceDirName){
  try{
    const manifest={
      version:1,
      created:new Date().toISOString(),
      sourceDir:sourceDirName||'',
      totalFiles:total,
      succeeded:succeeded,
      failed:failed,
      categories:stats,
      failedFiles:failedList,
    };
    const fh=await dirHandle.getFileHandle('_manifest.json',{create:true});
    const w=await fh.createWritable();
    await w.write(JSON.stringify(manifest,null,2));
    await w.close();
  }catch(e){/* 保存失败不阻塞 */}
}

// ============================================================
// UX12: 拖拽支持 (降级模式)
// ============================================================
function setupDropZone(){
  const zone=document.getElementById('dropZone');
  const fileInput=document.getElementById('fileInput');

  zone.addEventListener('click',()=>fileInput.click());

  zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('dragover')});
  zone.addEventListener('dragleave',()=>zone.classList.remove('dragover'));
  zone.addEventListener('drop',e=>{
    e.preventDefault();
    zone.classList.remove('dragover');
    const files=Array.from(e.dataTransfer.files).filter(f=>f.name.toLowerCase().endsWith('.zip'));
    if(files.length>0){
      selectedFiles=files;
      updateFileListDisplay();
      updateStartBtn();
    }
  });

  fileInput.addEventListener('change',e=>{
    selectedFiles=Array.from(e.target.files).filter(f=>f.name.toLowerCase().endsWith('.zip'));
    updateFileListDisplay();
    updateStartBtn();
  });
}

function updateFileListDisplay(){
  const disp=document.getElementById('fileListDisplay');
  if(selectedFiles.length===0){
    disp.classList.add('empty');
    disp.textContent='未选择';
  }else{
    disp.classList.remove('empty');
    disp.textContent='已选择 '+selectedFiles.length+' 个 zip 文件';
  }
}

// ============================================================
// Zip 解析 (纯 JS, 不依赖外部库)
// ============================================================
function parseZipEntries(buffer){
  const view=new DataView(buffer), u8=new Uint8Array(buffer);
  // 找 EOCD (PK\x05\x06)
  let eocdOff=-1;
  for(let i=buffer.byteLength-22;i>=Math.max(0,buffer.byteLength-65557);i--){
    if(view.getUint32(i,true)===0x06054b50){eocdOff=i;break}
  }
  if(eocdOff===-1) throw new Error('无效的 zip 文件');
  const cdOff=view.getUint32(eocdOff+16,true);
  const cdCount=view.getUint16(eocdOff+10,true);
  // Q8: ZIP64 检测
  if(cdOff===0xFFFFFFFF||cdCount===0xFFFF){
    throw new Error('ZIP64 格式暂不支持');
  }
  // 问题F: 校验 cdOff 在 buffer 范围内
  if(cdOff<0||cdOff+46>buffer.byteLength){
    throw new Error('无效的 zip 文件: 中央目录偏移越界');
  }
  const entries=[];
  let off=cdOff;
  for(let i=0;i<cdCount;i++){
    if(view.getUint32(off,true)!==0x02014b50) break;
    const method=view.getUint16(off+10,true);
    const compSize=view.getUint32(off+20,true);
    const nameLen=view.getUint16(off+28,true);
    const extraLen=view.getUint16(off+30,true);
    const commentLen=view.getUint16(off+32,true);
    const localOff=view.getUint32(off+42,true);
    const name=new TextDecoder().decode(u8.slice(off+46,off+46+nameLen));
    const localNameLen=view.getUint16(localOff+26,true);
    const localExtraLen=view.getUint16(localOff+28,true);
    const dataOff=localOff+30+localNameLen+localExtraLen;
    entries.push({name,method,compSize,dataOff});
    off+=46+nameLen+extraLen+commentLen;
  }
  return entries;
}

async function extractEntryData(buffer,entry){
  const u8=new Uint8Array(buffer);
  const compData=u8.slice(entry.dataOff,entry.dataOff+entry.compSize);
  if(entry.method===0) return compData; // Stored
  if(entry.method===8){ // Deflate (raw)
    const ds=new DecompressionStream('deflate-raw');
    const stream=new Blob([compData]).stream().pipeThrough(ds);
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }
  throw new Error('不支持的压缩方式: '+entry.method);
}

// ============================================================
// CSV 解析 (支持引号包裹的字段)
// ============================================================
function parseFaultCSV(text){
  const lines=text.split(/\r?\n/).filter(l=>l.length>0);
  if(lines.length<2) return null;
  const headers=parseCSVLine(lines[0]);
  const data=parseCSVLine(lines[1]);
  const get=field=>{
    const idx=headers.indexOf(field);
    return idx>=0&&idx<data.length?data[idx].trim():'';
  };
  return {classCode:get('FAULTINF_CLASS'),object:get('FAULTINF_OBJECT'),imgName:get('FAULTINF_IMGNAME')};
}

// Q7: 正确处理引号包裹的 CSV 字段
function parseCSVLine(line){
  const result=[];
  let cur='', inQuotes=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(inQuotes){
      if(ch==='"'){
        if(line[i+1]==='"'){cur+='"';i++} // 转义引号
        else inQuotes=false;
      }else cur+=ch;
    }else{
      if(ch==='"') inQuotes=true;
      else if(ch===','){result.push(cur);cur=''}
      else cur+=ch;
    }
  }
  result.push(cur);
  return result;
}

async function fileExists(dirHandle,name){
  try{await dirHandle.getFileHandle(name,{create:false});return true}catch{return false}
}

async function getUniqueFileHandle(dirHandle,name){
  const m=name.match(/^(.+)(\.[^.]+)$/);
  const base=m?m[1]:name, ext=m?m[2]:'';
  let tryName=name, i=0;
  while(await fileExists(dirHandle,tryName)){i++;tryName=base+'_'+i+ext}
  return await dirHandle.getFileHandle(tryName,{create:true});
}

// UX13: 日志区加上限, 超过 MAX_LOG_LINES 自动截断旧条目

// Bug5: 递归删除目录内容 (不删目录本身)
async function cleanDirContents(dirHandle){

// ============================================================
// 核心: 处理单个 zip (Q10: 移除未使用的 zipName 参数)
// ============================================================
async function processZipBuffer(buffer){
  let entries;
  try{
    entries=parseZipEntries(buffer);
  }catch(e){
    return {status:'failed',folder:'',error:e.message};
  }
  const csvEntry=entries.find(e=>e.name.toLowerCase().endsWith('.csv'));
  const jpgEntry=entries.find(e=>e.name.toLowerCase().endsWith('.jpg'));
  if(!jpgEntry) return {status:'skipped',folder:'',error:'无 jpg 文件'};

  // 解析 CSV 获取分类
  let folderName='未知_元数据缺失';
  if(csvEntry){
    try{
      const csvData=await extractEntryData(buffer,csvEntry);
      const csvText=new TextDecoder('utf-8').decode(csvData);
      const parsed=parseFaultCSV(csvText);
      if(parsed&&parsed.classCode) folderName=classCodeToName(parsed.classCode);
    }catch{/* CSV 损坏, 用默认分类 */}
  }

  // 提取 jpg
  let jpgData;
  try{
    jpgData=await extractEntryData(buffer,jpgEntry);
  }catch(e){
    return {status:'failed',folder:folderName,error:'jpg 提取失败: '+e.message};
  }
  const imgName=jpgEntry.name.split('/').pop();
  return {status:'ok',folder:folderName,imgName,imgData:jpgData};
}

// 主流程 - 完整模式 (File System Access API)
// ============================================================
async function startSortFullMode(){
  hideError();
  resetCancel();
  resetProgress();
  const btn=document.getElementById('startBtn');
  btn.disabled=true; btn.textContent='处理中...';
  document.getElementById('cancelBtn').style.display='inline-flex';
  document.getElementById('inputPanel').classList.add('processing');
  document.getElementById('progressSection').classList.add('active');
  document.getElementById('resultSection').classList.remove('active');

  // Bug4: 确定输出目录 (延迟创建, 不在 selectInputDir 时创建)
  let outDir=outputDirHandle;
  if(!outDir){
    try{
      outDir=await inputDirHandle.getDirectoryHandle('_sorted',{create:true});
      document.getElementById('outDirDisplay').classList.remove('empty');
      document.getElementById('outDirDisplay').textContent=inputDirHandle.name+'/_sorted';
    }catch(e){showError('无法创建输出目录: '+e.message);btn.disabled=false;btn.textContent='开始解析';document.getElementById('cancelBtn').style.display='none';document.getElementById('inputPanel').classList.remove('processing');return}
    // 问题D: 回写全局, 供后续 openPreview 使用
    outputDirHandle=outDir;
  }

  // 收集 zip 文件
  const zipFiles=[];
  for await(const[name,handle] of inputDirHandle.entries()){
    if(handle.kind==='file'&&name.toLowerCase().endsWith('.zip')){
      zipFiles.push({name,handle});
    }
  }
  if(zipFiles.length===0){
    showError('输入目录中未找到 .zip 文件');
    btn.disabled=false; btn.textContent='开始解析';
    document.getElementById('cancelBtn').style.display='none';
    document.getElementById('inputPanel').classList.remove('processing');
    return;
  }

  // Bug5+BugA: 确认有文件后才清理旧结果 (避免误选空目录导致旧结果被删)
  try{
    await cleanDirContents(outDir);
  }catch(e){/* 清理失败不阻塞, 可能是权限问题 */}

  const stats={}, dirCache={};
  let succeeded=0, failed=0;
  failedFiles=[];

  for(let i=0;i<zipFiles.length;i++){
    if(cancelled) break;
    const{name,handle}=zipFiles[i];
    let result;
    try{
      const file=await handle.getFile();
      const buffer=await file.arrayBuffer();
      result=await processZipBuffer(buffer);
    }catch(e){
      result={status:'failed',folder:'',error:e.message};
    }

    if(result.status==='ok'){
      try{
        if(!dirCache[result.folder]){
          dirCache[result.folder]=await outDir.getDirectoryHandle(result.folder,{create:true});
        }
        const fh=await getUniqueFileHandle(dirCache[result.folder],result.imgName);
        const w=await fh.createWritable();
        await w.write(result.imgData);
        await w.close();
        stats[result.folder]=(stats[result.folder]||0)+1;
        succeeded++;
      }catch(e){
        failed++;
        result.status='failed';
        result.folder=result.folder||'';
        result.error='写入失败: '+e.message;
        failedFiles.push({name,status:'fail',reason:result.error});
      }
    }else if(result.status==='failed'){
      failed++;
      failedFiles.push({name,status:'fail',reason:result.error||'未知错误'});
    }else{
      failed++;
      failedFiles.push({name,status:'skip',reason:result.error||'跳过'});
    }
    updateProgress(i+1,zipFiles.length,name,result.folder||'',result.status);
    if(i%5===0) await new Promise(r=>setTimeout(r,0));
  }

  if(cancelled){
    document.getElementById('progressText').textContent='已取消 (已处理 '+(succeeded+failed)+'/'+zipFiles.length+')';
  }
  showResults(stats,succeeded,failed,zipFiles.length,false);
  // 保存清单文件, 供下次「查看已分类」使用
  // 取消时 totalFiles 记录实际处理数, 避免查看时显示不一致
  const manifestTotal = cancelled ? (succeeded+failed) : zipFiles.length;
  await saveManifest(outDir,stats,succeeded,failed,manifestTotal,failedFiles,inputDirHandle.name);
  btn.disabled=false; btn.textContent='开始解析';
  document.getElementById('cancelBtn').style.display='none';
  document.getElementById('inputPanel').classList.remove('processing');
}

  document.getElementById('cancelBtn').style.display='none';
  document.getElementById('inputPanel').classList.remove('processing');

// 极简 zip 打包器 (STORE 模式)
async function createZipBlob(files){
  const chunks=[];
  const centralDir=[];
  let offset=0;

  for(const file of files){
    const nameBytes=new TextEncoder().encode(file.name);
    const data=file.data;
    const nameLen=nameBytes.length;
    const dataLen=data.length;
    const crc=crc32(data);

    const localHeader=new ArrayBuffer(30+nameLen);
    const lv=new DataView(localHeader);
    lv.setUint32(0,0x04034b50,true);
    lv.setUint16(4,20,true);
    lv.setUint16(6,0,true);
    lv.setUint16(8,0,true);       // store
    lv.setUint16(10,0,true);
    lv.setUint16(12,0,true);
    lv.setUint32(14,crc,true);
    lv.setUint32(18,dataLen,true);
    lv.setUint32(22,dataLen,true);
    lv.setUint16(26,nameLen,true);
    lv.setUint16(28,0,true);
    new Uint8Array(localHeader,30).set(nameBytes);

    chunks.push(new Uint8Array(localHeader));
    chunks.push(data);
    centralDir.push({nameBytes,nameLen,dataLen,crc,offset});
    offset+=30+nameLen+dataLen;
  }

  let cdOffset=offset, cdSize=0;
  for(const e of centralDir){
    const cd=new ArrayBuffer(46+e.nameLen);
    const cv=new DataView(cd);
    cv.setUint32(0,0x02014b50,true);
    cv.setUint16(4,20,true);cv.setUint16(6,20,true);
    cv.setUint16(8,0,true);cv.setUint16(10,0,true);
    cv.setUint16(12,0,true);cv.setUint16(14,0,true);
    cv.setUint32(16,e.crc,true);
    cv.setUint32(20,e.dataLen,true);
    cv.setUint32(24,e.dataLen,true);
    cv.setUint16(28,e.nameLen,true);
    cv.setUint16(30,0,true);cv.setUint16(32,0,true);
    cv.setUint16(34,0,true);cv.setUint16(36,0,true);
    cv.setUint32(38,0,true);
    cv.setUint32(42,e.offset,true);
    new Uint8Array(cd,46).set(e.nameBytes);
    chunks.push(new Uint8Array(cd));
    cdSize+=46+e.nameLen;
  }

  const eocd=new ArrayBuffer(22);
  const ev=new DataView(eocd);
  ev.setUint32(0,0x06054b50,true);
  ev.setUint16(4,0,true);ev.setUint16(6,0,true);
  ev.setUint16(8,files.length,true);
  ev.setUint16(10,files.length,true);
  ev.setUint32(12,cdSize,true);
  ev.setUint32(16,cdOffset,true);
  ev.setUint16(20,0,true);
  chunks.push(new Uint8Array(eocd));

  return new Blob(chunks,{type:'application/zip'});
}

// CRC32 查表实现
const crcTable=(()=>{
  const t=new Uint32Array(256);
  for(let i=0;i<256;i++){
    let c=i;
    for(let j=0;j<8;j++) c=c&1?0xEDB88320^(c>>>1):c>>>1;
    t[i]=c>>>0;
  }
  return t;
})();
function crc32(data){
  let crc=0xFFFFFFFF;
  for(let i=0;i<data.length;i++) crc=crcTable[(crc^data[i])&0xFF]^(crc>>>8);
  return (crc^0xFFFFFFFF)>>>0;
}

async function openPreview(folder){
  if(FULL_MODE){
    // 完整模式: 从磁盘读取
    // Bug1fix: 根据当前模式选择正确的目录 handle
    const activeDir = appMode==='view' ? viewOutputDirHandle : outputDirHandle;
    if(!activeDir){
      // 兜底: 分类模式下如果用了自动 _sorted 但全局未回写, 尝试重新获取
      if(appMode!=='view' && inputDirHandle){
        try{outputDirHandle=await inputDirHandle.getDirectoryHandle('_sorted')}
        catch{/* _sorted 不存在 */}
      }
      if(!outputDirHandle && appMode!=='view'){alert('输出目录不可用');return}
      if(appMode==='view'){alert('请先选择已分类的目录');return}
    }
    const useDir = appMode==='view' ? viewOutputDirHandle : outputDirHandle;
    try{
      const dir=await useDir.getDirectoryHandle(folder);
      const images=[];
      for await(const[name,handle] of dir.entries()){
        if(handle.kind==='file'&&name.toLowerCase().endsWith('.jpg')){
          images.push({folder,name,handle});
        }
      }
      if(images.length===0){alert('该分类下无图片');return}
      previewImages=images.sort((a,b)=>a.name.localeCompare(b.name));
      previewIndex=0;
      await showPreviewImageFromDisk();
      document.getElementById('previewOverlay').classList.add('active');
    }catch(e){alert('打开失败: '+e.message)}
  }else{
    // Bug3: 降级模式: 从内存 classifiedBlobs 预览
    const files=classifiedBlobs[folder];
    if(!files||files.length===0){alert('该分类下无图片');return}
    previewImages=files.map(f=>({folder,name:f.name,data:f.data}));
    previewIndex=0;
    await showPreviewImageFromMemory();
    document.getElementById('previewOverlay').classList.add('active');
  }
}

// Bug2: 切换前释放旧 ObjectURL
function revokeOldPreviewUrl(){
  if(currentPreviewUrl){
    URL.revokeObjectURL(currentPreviewUrl);
    currentPreviewUrl=null;
  }
}

async function showPreviewImageFromDisk(){
  if(previewImages.length===0) return;
  const seq=++previewSeq;
  const img=previewImages[previewIndex];
  const file=await img.handle.getFile();
  if(seq!==previewSeq) return;
  revokeOldPreviewUrl();
  currentPreviewUrl=URL.createObjectURL(file);
  const imgEl=document.getElementById('previewImg');
  imgEl.src=currentPreviewUrl;
  imgEl.onload=()=>{ zoomFit(); };  // 图片加载完成后自动适合窗口
  document.getElementById('previewCounter').textContent=(previewIndex+1)+' / '+previewImages.length;
}

async function showPreviewImageFromMemory(){
  if(previewImages.length===0) return;
  const seq=++previewSeq;
  const img=previewImages[previewIndex];
  if(seq!==previewSeq) return;
  revokeOldPreviewUrl();
  currentPreviewUrl=URL.createObjectURL(new Blob([img.data],{type:'image/jpeg'}));
  const imgEl=document.getElementById('previewImg');
  imgEl.src=currentPreviewUrl;
  imgEl.onload=()=>{ zoomFit(); };
  document.getElementById('previewCounter').textContent=(previewIndex+1)+' / '+previewImages.length;
}

// ============================================================
// 缩放控制 (用 width/height 实现, 配合 flexbox 居中)
// ============================================================
function applyZoom(){
  const img=document.getElementById('previewImg');
  if(img.naturalWidth){
    img.style.width=(img.naturalWidth*zoomLevel)+'px';
    img.style.height=(img.naturalHeight*zoomLevel)+'px';
  }
  document.getElementById('zoomInfo').textContent=Math.round(zoomLevel*100)+'%';
}

function zoomFit(){
  const img=document.getElementById('previewImg');
  const wrap=document.getElementById('previewImgWrap');
  if(!img.naturalWidth||!wrap.clientWidth){zoomLevel=1;applyZoom();return}
  const scaleX=wrap.clientWidth/img.naturalWidth;
  const scaleY=wrap.clientHeight/img.naturalHeight;
  zoomLevel=Math.min(scaleX,scaleY,1);
  if(zoomLevel<0.1) zoomLevel=0.1;
  applyZoom();
}

function zoomReset(){
  zoomLevel=1;
  applyZoom();
}

function zoomBy(delta){
  zoomLevel*=delta;
  if(zoomLevel<0.1) zoomLevel=0.1;
  if(zoomLevel>10) zoomLevel=10;
  applyZoom();
}

function prevImage(){
  if(previewImages.length===0) return;
  previewIndex=(previewIndex-1+previewImages.length)%previewImages.length;
  if(FULL_MODE) showPreviewImageFromDisk();
  else showPreviewImageFromMemory();
}
function nextImage(){
  if(previewImages.length===0) return;
  previewIndex=(previewIndex+1)%previewImages.length;
  if(FULL_MODE) showPreviewImageFromDisk();
  else showPreviewImageFromMemory();
}
function closePreview(){
  revokeOldPreviewUrl();
  document.getElementById('previewOverlay').classList.remove('active');
  document.getElementById('previewImg').src='';
  zoomLevel=1;
  isDragging=false;  // 重置拖拽状态, 避免关闭后残留
  document.getElementById('previewImgWrap').classList.remove('dragging');
}

// 键盘快捷键
document.addEventListener('keydown',e=>{
  // Bug2fix: 在 input/textarea 焦点时不拦截方向键
  const tag=e.target.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA') return;
  if(e.key==='Escape') closePreview();
  if(document.getElementById('previewOverlay').classList.contains('active')){
    if(e.key==='ArrowLeft') prevImage();
    if(e.key==='ArrowRight') nextImage();
    if(e.key==='+'||e.key==='=') zoomBy(1.25);
    if(e.key==='-') zoomBy(0.8);
    if(e.key==='0') zoomReset();
  }
});

// 滚轮缩放
(function setupZoom(){
  const wrap=document.getElementById('previewImgWrap');
  wrap.addEventListener('wheel',e=>{
    if(!document.getElementById('previewOverlay').classList.contains('active')) return;
    e.preventDefault();
    const delta=e.deltaY<0?1.15:1/1.15;
    zoomBy(delta);
  },{passive:false});

  // 拖拽平移
  wrap.addEventListener('mousedown',e=>{
    if(e.button!==0) return;
    isDragging=true;
    dragStartX=e.clientX;
    dragStartY=e.clientY;
    dragScrollX=wrap.scrollLeft;
    dragScrollY=wrap.scrollTop;
    wrap.classList.add('dragging');
  });
  document.addEventListener('mousemove',e=>{
    if(!isDragging) return;
    const wrap=document.getElementById('previewImgWrap');
    wrap.scrollLeft=dragScrollX-(e.clientX-dragStartX);
    wrap.scrollTop=dragScrollY-(e.clientY-dragStartY);
  });
  document.addEventListener('mouseup',()=>{
    if(isDragging){
      isDragging=false;
      document.getElementById('previewImgWrap').classList.remove('dragging');
    }
  });
})();
</script>
